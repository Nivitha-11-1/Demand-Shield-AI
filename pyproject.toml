[project]
name = "demand_shield_ai"
version = "0.1.0"
description = "demand_shield_ai using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[file-processing,litellm,tools]>=1.15.22,<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demand_shield_ai"]

[tool.crewai]
type = "flow"
definition = "src/demand_shield_ai/flow.json"
project_id = "9df4cd04-1c2f-49a5-9047-2928c12e647c"

[tool.uv]
override-dependencies = ["litellm<=1.82.6"]
